<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Мессенджер MAX – Друзья и группы</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #e5e5e5; height: 100vh; overflow: hidden; }
        .app { display: flex; height: 100%; background: #f0f2f5; }

        /* Панель чатов */
        .chats-panel { width: 100%; max-width: 360px; background: white; border-right: 1px solid #e9ecef; display: flex; flex-direction: column; transition: transform 0.2s ease; z-index: 10; }
        .chats-header { background: #075e54; color: white; padding: 16px; display: flex; justify-content: space-between; align-items: center; }
        .chats-header h1 { font-size: 1.4rem; font-weight: 500; }
        .chats-header button { background: none; border: none; color: white; font-size: 1.6rem; cursor: pointer; padding: 0 8px; }
        .create-chat-btn, .friends-btn { background: #25d366; border-radius: 30px; padding: 6px 12px; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 4px; margin-left: 4px; }
        .logout-btn { background: #ef4444; border-radius: 30px; padding: 6px 12px; font-size: 0.8rem; }

        .search-bar { padding: 8px 12px; background: #f6f6f6; border-bottom: 1px solid #ddd; }
        .search-bar input { width: 100%; padding: 10px; border: none; border-radius: 24px; background: white; font-size: 0.9rem; }

        .chats-list { flex: 1; overflow-y: auto; }
        .chat-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .chat-item:active { background: #f0f2f5; }
        .chat-avatar { width: 48px; height: 48px; background: #25d366; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 1.2rem; }
        .chat-info { flex: 1; }
        .chat-name { font-weight: 500; margin-bottom: 4px; }
        .chat-preview { font-size: 0.8rem; color: #6c757d; }

        /* Панель чата */
        .chat-panel { flex: 1; display: flex; flex-direction: column; background: #efeae2; background-image: radial-gradient(circle at 10% 20%, rgba(0,0,0,0.02) 2%, transparent 2%); background-size: 20px 20px; }
        .chat-header { background: #075e54; color: white; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
        .back-button { background: none; border: none; color: white; font-size: 1.8rem; cursor: pointer; display: none; line-height: 1; }
        .chat-title { font-weight: 500; font-size: 1.2rem; }
        .messages-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
        .message { max-width: 80%; padding: 8px 12px; border-radius: 18px; word-wrap: break-word; font-size: 0.95rem; }
        .message-own { background: #dcf8c5; align-self: flex-end; border-bottom-right-radius: 4px; }
        .message-other { background: white; align-self: flex-start; border-bottom-left-radius: 4px; }
        .message-sender { font-size: 0.7rem; font-weight: bold; margin-bottom: 4px; color: #075e54; }
        .input-area { background: #f0f2f5; padding: 12px; display: flex; gap: 8px; border-top: 1px solid #ddd; }
        .input-area input { flex: 1; padding: 12px; border: none; border-radius: 30px; background: white; font-size: 1rem; }
        .input-area button { background: #075e54; border: none; color: white; width: 48px; border-radius: 30px; cursor: pointer; font-size: 1.2rem; }

        /* Модальные окна */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; width: 90%; max-width: 400px; border-radius: 24px; padding: 20px; max-height: 80%; overflow-y: auto; }
        .modal-content h3 { margin-bottom: 16px; }
        .modal-content input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 24px; margin-bottom: 12px; }
        .user-list { max-height: 200px; overflow-y: auto; margin-bottom: 12px; border: 1px solid #eee; border-radius: 12px; padding: 8px; }
        .user-list label { display: block; margin-bottom: 8px; }
        .modal button { width: 100%; padding: 12px; border: none; border-radius: 24px; margin-top: 8px; background: #075e54; color: white; cursor: pointer; }
        .modal button.close { background: #ccc; color: black; }
        .toast { position: fixed; bottom: 20px; left: 20px; right: 20px; background: #323232; color: white; padding: 12px; border-radius: 30px; text-align: center; z-index: 1100; font-size: 0.9rem; }

        @media (max-width: 768px) {
            .chats-panel { position: absolute; left: 0; top: 0; height: 100%; width: 100%; max-width: none; transform: translateX(0%); transition: transform 0.2s; z-index: 20; background: white; }
            .chats-panel.hide { transform: translateX(-100%); }
            .chat-panel { width: 100%; }
            .back-button { display: block; }
        }
    </style>
</head>
<body>
<div class="app">
    <div id="chatsPanel" class="chats-panel">
        <div class="chats-header">
            <h1>Мессенджер</h1>
            <div style="display: flex; gap: 8px;">
                <button id="friendsBtn" class="friends-btn">👥 Друзья</button>
                <button id="createChatModalBtn" class="create-chat-btn">➕</button>
                <button id="logoutBtnMobile" class="logout-btn">🚪</button>
            </div>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Поиск чатов...">
        </div>
        <div id="chatsList" class="chats-list"><div style="text-align: center; padding: 24px;">Загрузка...</div></div>
    </div>

    <div id="chatPanel" class="chat-panel">
        <div class="chat-header">
            <button id="backButton" class="back-button">←</button>
            <span id="chatTitle" class="chat-title">Выберите чат</span>
        </div>
        <div id="messagesContainer" class="messages-container"><div style="text-align: center;">Выберите чат</div></div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Сообщение" disabled>
            <button id="sendMessageBtn">📤</button>
        </div>
    </div>
</div>

<!-- Модальное окно создания группового чата -->
<div id="createGroupModal" class="modal">
    <div class="modal-content">
        <h3>Новый групповой чат</h3>
        <input type="text" id="newGroupName" placeholder="Название группы">
        <div class="user-list" id="friendsForGroupList"></div>
        <button id="confirmCreateGroupBtn">Создать</button>
        <button id="closeGroupModalBtn" class="close">Отмена</button>
    </div>
</div>

<!-- Модальное окно друзей и заявок -->
<div id="friendsModal" class="modal">
    <div class="modal-content">
        <h3>Друзья и заявки</h3>
        <div id="friendsTabs">
            <button id="showFriendsListBtn" style="width:auto; display:inline-block; background:#075e54;">Друзья</button>
            <button id="showRequestsBtn" style="width:auto; display:inline-block; background:#ccc;">Заявки</button>
            <button id="showSearchBtn" style="width:auto; display:inline-block; background:#ccc;">Поиск</button>
        </div>
        <div id="friendsContent" style="margin-top: 16px;">
            <div id="friendsList"></div>
            <div id="requestsList" style="display:none;"></div>
            <div id="searchUsersDiv" style="display:none;">
                <input type="text" id="searchUserInput" placeholder="Поиск по логину">
                <button id="searchUserBtn">Найти</button>
                <div id="searchResults"></div>
            </div>
        </div>
        <button id="closeFriendsModalBtn" class="close">Закрыть</button>
    </div>
</div>

<script>
    // ========== НАСТРОЙКИ ==========
    const USER_API = "http://192.168.1.64:8001";
    const CHAT_API = "http://192.168.1.64:8000";

    let accessToken = localStorage.getItem('chat_token');
    let currentUserId = null;
    let currentChat = null;
    let allFriends = []; // список друзей {id, username}
    let toastQueue = [];
    let isShowingToast = false;

    function showToast(msg, isError = false) {
        toastQueue.push({msg, isError});
        if (!isShowingToast) processToastQueue();
    }
    function processToastQueue() {
        if (toastQueue.length === 0) { isShowingToast = false; return; }
        isShowingToast = true;
        const {msg, isError} = toastQueue.shift();
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = msg;
        toast.style.backgroundColor = isError ? '#d32f2f' : '#2e7d32';
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.remove();
            processToastQueue();
        }, 2500);
    }

    async function apiRequest(url, method, body = null, useAuth = true, apiBase = CHAT_API) {
        const headers = { 'Content-Type': 'application/json' };
        if (useAuth && accessToken) headers['Authorization'] = `Bearer ${accessToken}`;
        const options = { method, headers };
        if (body) options.body = JSON.stringify(body);
        const response = await fetch(`${apiBase}${url}`, options);
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Ошибка ${response.status}: ${errorText}`);
        }
        if (response.status === 204) return null;
        return await response.json();
    }

    // Авторизация
    async function showAuthScreen() {
        const authHtml = `
            <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background: white;">
                <div style="width: 85%; max-width: 320px; text-align: center;">
                    <h2>🔐 Мессенджер MAX</h2>
                    <input id="authUsername" placeholder="Логин" style="width:100%; padding:12px; margin:8px 0; border-radius:24px; border:1px solid #ddd;">
                    <input id="authPassword" type="password" placeholder="Пароль" style="width:100%; padding:12px; margin:8px 0; border-radius:24px; border:1px solid #ddd;">
                    <button id="authLoginBtn" style="width:100%; padding:12px; background:#075e54; color:white; border:none; border-radius:24px; margin-top:8px;">Вход</button>
                    <button id="authRegisterBtn" style="width:100%; padding:12px; background:#25d366; color:#075e54; border:none; border-radius:24px; margin-top:8px;">Регистрация</button>
                </div>
            </div>
        `;
        document.body.innerHTML = authHtml;
        document.getElementById('authLoginBtn').onclick = async () => {
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value;
            if (!username || !password) return showToast('Введите логин и пароль', true);
            try {
                const data = await apiRequest('/login', 'POST', { username, password }, false, USER_API);
                accessToken = data.access_token;
                localStorage.setItem('chat_token', accessToken);
                location.reload();
            } catch (err) { showToast(`Ошибка: ${err.message}`, true); }
        };
        document.getElementById('authRegisterBtn').onclick = async () => {
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value;
            if (!username || !password) return showToast('Введите логин и пароль', true);
            try {
                const data = await apiRequest('/register', 'POST', { username, password }, false, USER_API);
                accessToken = data.access_token;
                localStorage.setItem('chat_token', accessToken);
                location.reload();
            } catch (err) { showToast(`Ошибка: ${err.message}`, true); }
        };
    }
    if (!accessToken) { showAuthScreen(); } else { initApp(); }

    async function initApp() {
        try {
            const userData = await apiRequest('/auth/verify', 'GET', null, true, USER_API);
            currentUserId = userData.user_id;
            await loadFriends();
            await loadChats();
            if (window.innerWidth <= 768) {
                backButton.addEventListener('click', () => {
                    chatsPanel.classList.remove('hide');
                    currentChat = null;
                    messageInput.disabled = true;
                    chatTitleSpan.innerText = 'Выберите чат';
                    messagesContainer.innerHTML = '<div style="text-align:center;">Выберите чат</div>';
                });
            } else { backButton.style.display = 'none'; }
        } catch(err) { localStorage.removeItem('chat_token'); location.reload(); }
    }

    // Друзья
    async function loadFriends() {
        try {
            const res = await fetch(`${USER_API}/friends`, { headers: { 'Authorization': `Bearer ${accessToken}` } });
            if (res.ok) allFriends = await res.json();
            else allFriends = [];
            renderFriendsList();
            renderFriendsForGroup();
        } catch(e) { allFriends = []; }
    }
    function renderFriendsList() {
        const container = document.getElementById('friendsList');
        if (!container) return;
        if (!allFriends.length) { container.innerHTML = '<div>У вас пока нет друзей. Найдите пользователей через поиск.</div>'; return; }
        container.innerHTML = '';
        allFriends.forEach(f => {
            const div = document.createElement('div');
            div.style.padding = '8px';
            div.style.borderBottom = '1px solid #eee';
            div.innerHTML = `${escapeHtml(f.username)} <button class="startChatBtn" data-id="${f.id}" style="float:right; background:#075e54; padding:4px 12px;">Написать</button>`;
            container.appendChild(div);
        });
        document.querySelectorAll('.startChatBtn').forEach(btn => {
            btn.onclick = async (e) => {
                const friendId = parseInt(btn.dataset.id);
                await startPrivateChat(friendId);
            };
        });
    }
    async function startPrivateChat(friendId) {
        // Ищем среди существующих чатов личный чат с этим другом (по названию или по участникам)
        // Упрощённо: создаём чат с названием "Личный с username"
        const friend = allFriends.find(f => f.id === friendId);
        if (!friend) return;
        const chatName = `Личный чат с ${friend.username}`;
        try {
            const newChat = await apiRequest('/chats/', 'POST', { name: chatName, member_ids: [currentUserId, friendId] });
            showToast(`Чат создан`);
            await loadChats();
            openChat(newChat.id, newChat.name);
            closeFriendsModal();
        } catch(err) { showToast(`Ошибка: ${err.message}`, true); }
    }
    function renderFriendsForGroup() {
        const container = document.getElementById('friendsForGroupList');
        if (!container) return;
        if (!allFriends.length) { container.innerHTML = '<div>Нет друзей для добавления в группу</div>'; return; }
        let html = '';
        allFriends.forEach(f => {
            html += `<label><input type="checkbox" value="${f.id}"> ${escapeHtml(f.username)}</label>`;
        });
        container.innerHTML = html;
    }
    function getSelectedFriendsForGroup() {
        const checkboxes = document.querySelectorAll('#friendsForGroupList input:checked');
        return Array.from(checkboxes).map(cb => parseInt(cb.value));
    }
    // Поиск пользователей
    async function searchUsers(query) {
        if (!query.trim()) return [];
        try {
            const res = await fetch(`${USER_API}/users/search?q=${encodeURIComponent(query)}`, { headers: { 'Authorization': `Bearer ${accessToken}` } });
            if (!res.ok) return [];
            return await res.json();
        } catch(e) { return []; }
    }
    // Заявки
    async function loadIncomingRequests() {
        try {
            const res = await fetch(`${USER_API}/friends/requests/incoming`, { headers: { 'Authorization': `Bearer ${accessToken}` } });
            if (!res.ok) return [];
            return await res.json();
        } catch(e) { return []; }
    }
    async function acceptRequest(requestId) {
        try {
            await fetch(`${USER_API}/friends/accept/${requestId}`, { method: 'POST', headers: { 'Authorization': `Bearer ${accessToken}` } });
            showToast('Заявка принята');
            await loadFriends();
            await loadChats();
        } catch(e) { showToast('Ошибка', true); }
    }
    async function sendFriendRequest(userId) {
        try {
            await fetch(`${USER_API}/friends/request/${userId}`, { method: 'POST', headers: { 'Authorization': `Bearer ${accessToken}` } });
            showToast('Заявка отправлена');
        } catch(e) { showToast('Ошибка', true); }
    }
    // Модальное окно друзей
    const friendsModal = document.getElementById('friendsModal');
    const friendsBtn = document.getElementById('friendsBtn');
    const closeFriendsModalBtn = document.getElementById('closeFriendsModalBtn');
    friendsBtn.onclick = () => { friendsModal.style.display = 'flex'; refreshFriendsModal(); };
    closeFriendsModalBtn.onclick = () => { friendsModal.style.display = 'none'; };
    async function refreshFriendsModal() {
        await loadFriends();
        const friendsListDiv = document.getElementById('friendsList');
        const requestsListDiv = document.getElementById('requestsList');
        const searchUsersDiv = document.getElementById('searchUsersDiv');
        // по умолчанию показываем друзей
        document.getElementById('friendsList').style.display = 'block';
        document.getElementById('requestsList').style.display = 'none';
        document.getElementById('searchUsersDiv').style.display = 'none';
        // загружаем заявки
        const requests = await loadIncomingRequests();
        if (requests.length) {
            requestsListDiv.innerHTML = '';
            requests.forEach(req => {
                const div = document.createElement('div');
                div.style.padding = '8px';
                div.innerHTML = `${escapeHtml(req.from_user.username)} хочет добавить в друзья <button class="acceptReqBtn" data-id="${req.id}">Принять</button>`;
                requestsListDiv.appendChild(div);
            });
            document.querySelectorAll('.acceptReqBtn').forEach(btn => {
                btn.onclick = () => acceptRequest(parseInt(btn.dataset.id));
            });
        } else { requestsListDiv.innerHTML = '<div>Нет входящих заявок</div>'; }
    }
    // Поиск
    document.getElementById('showFriendsListBtn').onclick = () => {
        document.getElementById('friendsList').style.display = 'block';
        document.getElementById('requestsList').style.display = 'none';
        document.getElementById('searchUsersDiv').style.display = 'none';
    };
    document.getElementById('showRequestsBtn').onclick = () => {
        document.getElementById('friendsList').style.display = 'none';
        document.getElementById('requestsList').style.display = 'block';
        document.getElementById('searchUsersDiv').style.display = 'none';
        refreshFriendsModal();
    };
    document.getElementById('showSearchBtn').onclick = () => {
        document.getElementById('friendsList').style.display = 'none';
        document.getElementById('requestsList').style.display = 'none';
        document.getElementById('searchUsersDiv').style.display = 'block';
    };
    document.getElementById('searchUserBtn').onclick = async () => {
        const query = document.getElementById('searchUserInput').value;
        const results = await searchUsers(query);
        const container = document.getElementById('searchResults');
        if (!results.length) { container.innerHTML = '<div>Ничего не найдено</div>'; return; }
        container.innerHTML = '';
        results.forEach(u => {
            const div = document.createElement('div');
            div.style.padding = '8px';
            div.innerHTML = `${escapeHtml(u.username)} <button class="addFriendBtn" data-id="${u.id}">+ Добавить в друзья</button>`;
            container.appendChild(div);
        });
        document.querySelectorAll('.addFriendBtn').forEach(btn => {
            btn.onclick = () => sendFriendRequest(parseInt(btn.dataset.id));
        });
    };
    // Групповые чаты
    const createGroupModal = document.getElementById('createGroupModal');
    const createChatModalBtn = document.getElementById('createChatModalBtn');
    const closeGroupModalBtn = document.getElementById('closeGroupModalBtn');
    const confirmCreateGroupBtn = document.getElementById('confirmCreateGroupBtn');
    createChatModalBtn.onclick = () => { createGroupModal.style.display = 'flex'; renderFriendsForGroup(); };
    closeGroupModalBtn.onclick = () => { createGroupModal.style.display = 'none'; };
    confirmCreateGroupBtn.onclick = async () => {
        const name = document.getElementById('newGroupName').value.trim();
        if (!name) { showToast('Введите название группы', true); return; }
        const memberIds = getSelectedFriendsForGroup();
        if (!memberIds.length) { showToast('Выберите хотя бы одного друга', true); return; }
        memberIds.push(currentUserId);
        try {
            const newChat = await apiRequest('/chats/', 'POST', { name, member_ids: memberIds });
            document.getElementById('newGroupName').value = '';
            createGroupModal.style.display = 'none';
            showToast(`Группа "${name}" создана`);
            await loadChats();
            openChat(newChat.id, newChat.name);
        } catch(err) { showToast(`Ошибка: ${err.message}`, true); }
    };
    // Чаты и сообщения
    async function loadChats() {
        try {
            const chats = await apiRequest('/chats/', 'GET');
            renderChatsList(chats);
        } catch(err) { showToast('Ошибка загрузки чатов', true); }
    }
    function renderChatsList(chats) {
        const container = document.getElementById('chatsList');
        if (!chats.length) { container.innerHTML = '<div style="padding:24px; text-align:center;">Нет чатов. Создайте группу или напишите другу.</div>'; return; }
        container.innerHTML = '';
        chats.forEach(chat => {
            const div = document.createElement('div');
            div.className = 'chat-item';
            const avatar = document.createElement('div');
            avatar.className = 'chat-avatar';
            avatar.textContent = chat.name[0].toUpperCase();
            const info = document.createElement('div');
            info.className = 'chat-info';
            info.innerHTML = `<div class="chat-name">${escapeHtml(chat.name)}</div><div class="chat-preview">Нажмите для переписки</div>`;
            div.appendChild(avatar);
            div.appendChild(info);
            div.onclick = () => openChat(chat.id, chat.name);
            container.appendChild(div);
        });
    }
    async function openChat(chatId, chatName) {
        currentChat = { id: chatId, name: chatName };
        document.getElementById('chatTitle').innerText = chatName;
        await loadMessages(chatId);
        document.getElementById('messageInput').disabled = false;
        if (window.innerWidth <= 768) document.getElementById('chatsPanel').classList.add('hide');
    }
    async function loadMessages(chatId) {
        try {
            const msgs = await apiRequest(`/messages/${chatId}?limit=50`, 'GET');
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            if (!msgs.length) { container.innerHTML = '<div style="text-align:center;">Нет сообщений</div>'; return; }
            // Для отображения имён нужно знать соответствие id -> username. У нас есть allFriends и currentUserId.
            // Но в чате могут быть участники, не являющиеся друзьями (группа). Получим список всех участников чата? Упростим: если sender_id === currentUserId -> "Вы", иначе попробуем найти в allFriends, иначе "Пользователь {id}".
            const usernames = new Map();
            usernames.set(currentUserId, 'Вы');
            for (let f of allFriends) usernames.set(f.id, f.username);
            // Также можно дополнительно запросить имена не-друзей через /users, но для простоты оставим id.
            [...msgs].reverse().forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.sender_id === currentUserId ? 'message-own' : 'message-other'}`;
                const senderSpan = document.createElement('div');
                senderSpan.className = 'message-sender';
                let senderName = usernames.get(msg.sender_id);
                if (!senderName) senderName = `Пользователь ${msg.sender_id}`;
                senderSpan.textContent = senderName;
                const textSpan = document.createElement('div');
                textSpan.textContent = msg.text;
                div.appendChild(senderSpan);
                div.appendChild(textSpan);
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        } catch(err) { showToast('Ошибка загрузки сообщений', true); }
    }
    async function sendMessage() {
        const text = document.getElementById('messageInput').value.trim();
        if (!text || !currentChat) return;
        try {
            await apiRequest(`/messages/${currentChat.id}`, 'POST', { text });
            document.getElementById('messageInput').value = '';
            await loadMessages(currentChat.id);
        } catch(err) { showToast('Ошибка отправки', true); }
    }
    async function logout() {
        localStorage.removeItem('chat_token');
        location.reload();
    }
    // Event listeners
    document.getElementById('sendMessageBtn').onclick = sendMessage;
    document.getElementById('messageInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    document.getElementById('logoutBtnMobile').onclick = logout;
    const backButton = document.getElementById('backButton');
    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        document.querySelectorAll('.chat-item').forEach(item => {
            const name = item.querySelector('.chat-name')?.innerText.toLowerCase() || '';
            item.style.display = name.includes(query) ? 'flex' : 'none';
        });
    });
    function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
</script>
</body>
</html>
