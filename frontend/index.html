<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Мессенджер MAX – Универсал</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #e5e7eb;
            height: 100vh;
            overflow: hidden;
        }
        .app {
            display: flex;
            height: 100%;
            background: #f0f2f5;
        }
        /* Левая панель (список чатов) */
        .chats-panel {
            width: 360px;
            background: white;
            border-right: 1px solid #e9ecef;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        /* Правая панель (чат) */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #efeae2;
            background-image: radial-gradient(circle at 10% 20%, rgba(0,0,0,0.02) 2%, transparent 2%);
            background-size: 20px 20px;
        }
        /* Шапки */
        .chats-header, .chat-header {
            background: #075e54;
            color: white;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .chats-header h1, .chat-header h2 {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .header-buttons {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .header-buttons button, .logout-btn {
            background: #128C7E;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 24px;
            cursor: pointer;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .logout-btn { background: #ef4444 !important; }
        .current-user {
            font-size: 0.85rem;
            background: #0a4d44;
            padding: 4px 12px;
            border-radius: 20px;
            margin-left: 8px;
            white-space: nowrap;
        }
        .search-bar {
            padding: 8px 12px;
            background: #f6f6f6;
            border-bottom: 1px solid #ddd;
        }
        .search-bar input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 24px;
            background: white;
            font-size: 0.9rem;
        }
        .chats-list {
            flex: 1;
            overflow-y: auto;
        }
        .chat-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.1s;
        }
        .chat-item:active { background: #f5f5f5; }
        .chat-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        .chat-avatar {
            width: 48px;
            height: 48px;
            background: #25d366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .chat-name { font-weight: 500; }
        .delete-chat-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #9ca3af;
            padding: 6px;
            border-radius: 50%;
        }
        .delete-chat-btn:active { background: #fee2e2; color: #dc2626; }
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 18px;
            word-wrap: break-word;
            font-size: 0.95rem;
        }
        .message-own {
            background: #dcf8c5;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message-other {
            background: white;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .message-sender {
            font-size: 0.7rem;
            font-weight: bold;
            margin-bottom: 4px;
            color: #075e54;
        }
        .input-area {
            background: #f0f2f5;
            padding: 12px;
            display: flex;
            gap: 8px;
            border-top: 1px solid #ddd;
        }
        .input-area input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 30px;
            background: white;
            font-size: 1rem;
        }
        .input-area button {
            background: #075e54;
            border: none;
            color: white;
            width: 48px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.2rem;
        }
        .back-button {
            background: none;
            border: none;
            color: white;
            font-size: 1.6rem;
            cursor: pointer;
            margin-right: 10px;
            line-height: 1;
            display: none;
        }
        /* Модалки */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            width: 400px;
            max-width: 90%;
            border-radius: 24px;
            padding: 20px;
        }
        .modal-content h3 { margin-bottom: 16px; }
        .modal-content input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 12px;
        }
        .user-list {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 12px;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 8px;
        }
        .user-list label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding: 4px;
        }
        .modal button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 12px;
            margin-top: 8px;
            background: #075e54;
            color: white;
            cursor: pointer;
        }
        .modal button.close { background: #9ca3af; }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: #323232;
            color: white;
            padding: 12px;
            border-radius: 30px;
            text-align: center;
            z-index: 1100;
            font-size: 0.9rem;
            max-width: 400px;
            margin: 0 auto;
        }
        /* Адаптив для телефона: левая панель изначально скрыта, показывается кнопка назад */
        @media (max-width: 768px) {
            .chats-panel {
                position: fixed;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                z-index: 20;
                background: white;
                display: none;
            }
            .chat-panel {
                width: 100%;
            }
            .back-button {
                display: block;
            }
            .current-user {
                display: none;
            }
        }
        /* На ПК левая панель всегда видна, кнопка назад скрыта */
        @media (min-width: 769px) {
            .chats-panel {
                display: flex !important;
            }
            .back-button {
                display: none !important;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- Панель списка чатов -->
    <div id="chatsPanel" class="chats-panel">
        <div class="chats-header">
            <h1>📱 Мессенджер</h1>
            <div class="header-buttons">
                <button id="friendsBtn">👥 Друзья</button>
                <button id="createGroupBtn">➕ Группа</button>
                <button id="logoutBtn" class="logout-btn">🚪</button>
            </div>
        </div>
        <div class="search-bar">
            <input type="text" id="searchChatsInput" placeholder="🔍 Поиск чатов...">
        </div>
        <div id="chatsList" class="chats-list"><div style="text-align:center; padding:24px;">Загрузка...</div></div>
    </div>

    <!-- Панель активного чата -->
    <div id="chatPanel" class="chat-panel">
        <div class="chat-header">
            <button id="backButton" class="back-button">←</button>
            <h2 id="chatTitle">Выберите чат</h2>
            <div id="currentUserDisplay" class="current-user"></div>
        </div>
        <div id="messagesContainer" class="messages-container"><div style="text-align:center;">Выберите чат</div></div>
        <div id="inputArea" class="input-area">
            <input type="text" id="messageInput" placeholder="Сообщение" disabled>
            <button id="sendBtn">📤</button>
        </div>
    </div>
</div>

<!-- Модалки -->
<div id="friendsModal" class="modal"><div class="modal-content"><h3>👥 Друзья и заявки</h3><div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;"><button id="showFriendsTab" style="width:auto;">Друзья</button><button id="showRequestsTab" style="width:auto;">Заявки</button><button id="showSearchTab" style="width:auto;">Поиск</button></div><div id="friendsTabContent"><div id="friendsListContainer"></div></div><div id="requestsTabContent" style="display:none;"><div id="requestsListContainer"></div></div><div id="searchTabContent" style="display:none;"><input type="text" id="searchUserInput" placeholder="Логин"><button id="doSearchBtn">🔍 Найти</button><div id="searchResultsContainer"></div></div><button id="closeFriendsModalBtn" class="close">Закрыть</button></div></div>

<div id="groupModal" class="modal"><div class="modal-content"><h3>➕ Новая группа</h3><input type="text" id="groupName" placeholder="Название группы"><div class="user-list" id="friendsForGroupList"></div><button id="confirmGroupBtn">Создать</button><button id="closeGroupModalBtn" class="close">Отмена</button></div></div>

<script>
    // ========== АВТООПРЕДЕЛЕНИЕ API ==========
    const currentHost = window.location.hostname;
    let USER_API, CHAT_API;
    if (currentHost === 'localhost' || currentHost === '127.0.0.1') {
        USER_API = "http://localhost:8001";
        CHAT_API = "http://localhost:8000";
    } else {
        USER_API = `http://${currentHost}:8001`;
        CHAT_API = `http://${currentHost}:8000`;
    }
    console.log(`API: ${USER_API}, ${CHAT_API}`);

    let accessToken = localStorage.getItem('chat_token');
    let currentUserId = null;
    let currentUsername = null;
    let currentChatId = null;
    let chats = [];
    let allFriends = [];
    let toastQueue = [];
    let isShowingToast = false;

    function showToast(msg, isError = false) {
        toastQueue.push({msg, isError});
        if (!isShowingToast) processToastQueue();
    }
    function processToastQueue() {
        if (toastQueue.length === 0) { isShowingToast = false; return; }
        isShowingToast = true;
        const {msg, isError} = toastQueue.shift();
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = msg;
        toast.style.backgroundColor = isError ? '#dc2626' : '#16a34a';
        document.body.appendChild(toast);
        setTimeout(() => { toast.remove(); processToastQueue(); }, 2500);
    }

    async function apiRequest(url, method, body = null, useAuth = true, apiBase = CHAT_API) {
        const headers = { 'Content-Type': 'application/json' };
        if (useAuth && accessToken) headers['Authorization'] = `Bearer ${accessToken}`;
        const options = { method, headers };
        if (body) options.body = JSON.stringify(body);
        const response = await fetch(`${apiBase}${url}`, options);
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Ошибка ${response.status}: ${errorText}`);
        }
        if (response.status === 204) return null;
        return await response.json();
    }

    // Авторизация
    async function showAuthScreen() {
        const authHtml = `<div style="display:flex; justify-content:center; align-items:center; height:100vh; background:white;"><div style="width:85%; max-width:320px; text-align:center;"><h2>🔐 Мессенджер MAX</h2><input id="authUsername" placeholder="Логин" style="width:100%; padding:12px; margin:8px 0; border-radius:24px; border:1px solid #ddd;"><input id="authPassword" type="password" placeholder="Пароль" style="width:100%; padding:12px; margin:8px 0; border-radius:24px; border:1px solid #ddd;"><button id="authLoginBtn" style="width:100%; padding:12px; background:#075e54; color:white; border:none; border-radius:24px;">Вход</button><button id="authRegisterBtn" style="width:100%; padding:12px; background:#25d366; color:#075e54; border:none; border-radius:24px; margin-top:8px;">Регистрация</button></div></div>`;
        document.body.innerHTML = authHtml;
        document.getElementById('authLoginBtn').onclick = async () => {
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value;
            if (!username || !password) return showToast('Введите логин и пароль', true);
            try {
                const data = await apiRequest('/login', 'POST', { username, password }, false, USER_API);
                accessToken = data.access_token;
                localStorage.setItem('chat_token', accessToken);
                location.reload();
            } catch (err) { showToast(`Ошибка: ${err.message}`, true); }
        };
        document.getElementById('authRegisterBtn').onclick = async () => {
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value;
            if (!username || !password) return showToast('Введите логин и пароль', true);
            try {
                const data = await apiRequest('/register', 'POST', { username, password }, false, USER_API);
                accessToken = data.access_token;
                localStorage.setItem('chat_token', accessToken);
                location.reload();
            } catch (err) { showToast(`Ошибка: ${err.message}`, true); }
        };
    }

    if (!accessToken) { showAuthScreen(); } else { initApp(); }

    async function initApp() {
        try {
            const userData = await apiRequest('/auth/verify', 'GET', null, true, USER_API);
            currentUserId = userData.user_id;
            currentUsername = userData.username;
            document.getElementById('currentUserDisplay').textContent = `👤 ${currentUsername}`;
            await loadFriends();
            await loadChats();

            // Настройка кнопки "Назад" (для телефона)
            const backBtn = document.getElementById('backButton');
            backBtn.onclick = () => {
                if (window.innerWidth <= 768) {
                    document.getElementById('chatsPanel').style.display = 'flex';
                    currentChatId = null;
                    document.getElementById('messageInput').disabled = true;
                    document.getElementById('chatTitle').innerText = 'Выберите чат';
                    document.getElementById('messagesContainer').innerHTML = '<div style="text-align:center;">Выберите чат слева</div>';
                }
            };

            // Если ПК – левая панель видна всегда
            if (window.innerWidth >= 769) {
                document.getElementById('chatsPanel').style.display = 'flex';
            } else {
                // На телефоне изначально показываем панель чатов
                document.getElementById('chatsPanel').style.display = 'flex';
            }
        } catch(err) {
            localStorage.removeItem('chat_token');
            location.reload();
        }
    }

    // Друзья (сокращённо, но рабоче)
    async function loadFriends() { try { const res = await fetch(`${USER_API}/friends`, { headers: { 'Authorization': `Bearer ${accessToken}` } }); if (res.ok) allFriends = await res.json(); else allFriends = []; return allFriends; } catch(e) { return []; } }
    async function deleteFriend(friendId) { try { await fetch(`${USER_API}/friends/${friendId}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${accessToken}` } }); showToast('Друг удалён'); await loadFriends(); await loadChats(); refreshFriendsModal(); } catch(e) { showToast('Ошибка удаления', true); } }
    async function searchUsers(query) { if (!query.trim()) return []; try { const res = await fetch(`${USER_API}/users/search?q=${encodeURIComponent(query)}`, { headers: { 'Authorization': `Bearer ${accessToken}` } }); if (!res.ok) return []; return await res.json(); } catch(e) { return []; } }
    async function loadIncomingRequests() { try { const res = await fetch(`${USER_API}/friends/requests/incoming`, { headers: { 'Authorization': `Bearer ${accessToken}` } }); if (!res.ok) return []; return await res.json(); } catch(e) { return []; } }
    async function acceptRequest(requestId) { try { await fetch(`${USER_API}/friends/accept/${requestId}`, { method: 'POST', headers: { 'Authorization': `Bearer ${accessToken}` } }); showToast('Заявка принята'); await loadFriends(); await loadChats(); refreshFriendsModal(); } catch(e) { showToast('Ошибка', true); } }
    async function sendFriendRequest(userId) { try { await fetch(`${USER_API}/friends/request/${userId}`, { method: 'POST', headers: { 'Authorization': `Bearer ${accessToken}` } }); showToast('Заявка отправлена'); } catch(e) { showToast('Ошибка', true); } }

    // Чаты
    async function deleteChat(chatId) {
        try {
            await apiRequest(`/chats/${chatId}`, 'DELETE');
            showToast('Чат удалён');
            if (currentChatId === chatId) {
                currentChatId = null;
                document.getElementById('messageInput').disabled = true;
                document.getElementById('chatTitle').innerText = 'Выберите чат';
                document.getElementById('messagesContainer').innerHTML = '<div style="text-align:center;">Выберите чат слева</div>';
                if (window.innerWidth <= 768) document.getElementById('chatsPanel').style.display = 'flex';
            }
            await loadChats();
        } catch(e) { showToast(`Ошибка: ${e.message}`, true); }
    }

    async function createGroupChat(groupName, memberIds) {
        if (!groupName.trim()) throw new Error('Введите название');
        if (memberIds.length < 1) throw new Error('Выберите хотя бы одного друга');
        const allMemberIds = [...new Set([...memberIds, currentUserId])];
        return await apiRequest('/chats/', 'POST', { name: groupName, member_ids: allMemberIds });
    }

    async function loadChats() {
        try {
            chats = await apiRequest('/chats/', 'GET');
            renderChatList();
            if (chats.length > 0 && !currentChatId) selectChat(chats[0].id);
            else if (chats.length === 0) document.getElementById('messagesContainer').innerHTML = '<div style="text-align:center;">Нет чатов</div>';
        } catch(err) { showToast('Ошибка загрузки чатов', true); }
    }

    function renderChatList() {
        const container = document.getElementById('chatsList');
        if (!chats.length) { container.innerHTML = '<div style="padding:20px; text-align:center;">Чатов пока нет</div>'; return; }
        container.innerHTML = '';
        chats.forEach(chat => {
            const div = document.createElement('div');
            div.className = 'chat-item';
            div.innerHTML = `
                <div class="chat-info">
                    <div class="chat-avatar">${escapeHtml(chat.name[0].toUpperCase())}</div>
                    <div class="chat-name">${escapeHtml(chat.name)}</div>
                </div>
                <button class="delete-chat-btn" data-id="${chat.id}" title="Удалить">🗑️</button>
            `;
            div.querySelector('.chat-info').onclick = (e) => { e.stopPropagation(); selectChat(chat.id); };
            const delBtn = div.querySelector('.delete-chat-btn');
            delBtn.onclick = (e) => { e.stopPropagation(); if(confirm('Удалить чат?')) deleteChat(chat.id); };
            container.appendChild(div);
        });
    }

    async function selectChat(chatId) {
        currentChatId = chatId;
        renderChatList();
        const selectedChat = chats.find(c => c.id === chatId);
        document.getElementById('chatTitle').innerText = selectedChat ? selectedChat.name : 'Чат';
        document.getElementById('messageInput').disabled = false;
        await loadMessages(chatId);
        if (window.innerWidth <= 768) {
            document.getElementById('chatsPanel').style.display = 'none';
        }
    }

    async function loadMessages(chatId) {
        try {
            const msgs = await apiRequest(`/messages/${chatId}?limit=50`, 'GET');
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            if (!msgs.length) { container.innerHTML = '<div style="text-align:center;">Нет сообщений</div>'; return; }
            const nameMap = new Map(); nameMap.set(currentUserId, 'Вы');
            allFriends.forEach(f => nameMap.set(f.id, f.username));
            [...msgs].reverse().forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.sender_id === currentUserId ? 'message-own' : 'message-other'}`;
                const senderSpan = document.createElement('div');
                senderSpan.className = 'message-sender';
                let senderName = nameMap.get(msg.sender_id);
                if (!senderName) senderName = `Пользователь ${msg.sender_id}`;
                senderSpan.textContent = senderName;
                const textSpan = document.createElement('div');
                textSpan.textContent = msg.text;
                div.appendChild(senderSpan);
                div.appendChild(textSpan);
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        } catch(err) { showToast('Ошибка загрузки сообщений', true); }
    }

    async function sendMessage() {
        const text = document.getElementById('messageInput').value.trim();
        if (!text || !currentChatId) return;
        try {
            await apiRequest(`/messages/${currentChatId}`, 'POST', { text });
            document.getElementById('messageInput').value = '';
            await loadMessages(currentChatId);
        } catch(err) { showToast('Ошибка отправки', true); }
    }

    // Модалка друзей (сокращённая)
    const friendsModal = document.getElementById('friendsModal');
    const friendsBtn = document.getElementById('friendsBtn');
    const closeFriendsModalBtn = document.getElementById('closeFriendsModalBtn');
    friendsBtn.onclick = () => { friendsModal.style.display = 'flex'; refreshFriendsModal(); };
    closeFriendsModalBtn.onclick = () => { friendsModal.style.display = 'none'; };
    async function refreshFriendsModal() {
        await loadFriends();
        const friendsContainer = document.getElementById('friendsListContainer');
        if (!allFriends.length) friendsContainer.innerHTML = '<div>Нет друзей</div>';
        else {
            friendsContainer.innerHTML = '';
            allFriends.forEach(f => {
                const div = document.createElement('div');
                div.style.padding = '8px';
                div.style.borderBottom = '1px solid #eee';
                div.style.display = 'flex';
                div.style.justifyContent = 'space-between';
                div.style.alignItems = 'center';
                div.innerHTML = `<span>${escapeHtml(f.username)}</span>
                                <div><button class="startChatBtn" data-id="${f.id}" style="margin-right:8px;">💬 Написать</button>
                                <button class="deleteFriendBtn" data-id="${f.id}" style="background:none; border:none; color:#dc2626; cursor:pointer;">🗑️</button></div>`;
                friendsContainer.appendChild(div);
            });
            document.querySelectorAll('.startChatBtn').forEach(btn => {
                btn.onclick = async (e) => {
                    const friendId = parseInt(btn.dataset.id);
                    const friend = allFriends.find(f => f.id === friendId);
                    if (!friend) return;
                    const chatName = `Личный чат с ${friend.username}`;
                    try {
                        const newChat = await apiRequest('/chats/', 'POST', { name: chatName, member_ids: [currentUserId, friendId] });
                        showToast(`Чат с ${friend.username} создан`);
                        await loadChats();
                        selectChat(newChat.id);
                        friendsModal.style.display = 'none';
                    } catch(err) { showToast(`Ошибка: ${err.message}`, true); }
                };
            });
            document.querySelectorAll('.deleteFriendBtn').forEach(btn => {
                btn.onclick = () => { if(confirm('Удалить друга?')) deleteFriend(parseInt(btn.dataset.id)); };
            });
        }
        const requests = await loadIncomingRequests();
        const reqContainer = document.getElementById('requestsListContainer');
        if (!requests.length) reqContainer.innerHTML = '<div>Нет заявок</div>';
        else {
            reqContainer.innerHTML = '';
            requests.forEach(req => {
                const div = document.createElement('div');
                div.style.padding = '8px';
                div.innerHTML = `${escapeHtml(req.from_user.username)} хочет добавить в друзья <button class="acceptReqBtn" data-id="${req.id}">Принять</button>`;
                reqContainer.appendChild(div);
            });
            document.querySelectorAll('.acceptReqBtn').forEach(btn => {
                btn.onclick = () => acceptRequest(parseInt(btn.dataset.id));
            });
        }
        document.getElementById('searchUserInput').value = '';
        document.getElementById('searchResultsContainer').innerHTML = '';
    }
    document.getElementById('showFriendsTab').onclick = () => {
        document.getElementById('friendsTabContent').style.display = 'block';
        document.getElementById('requestsTabContent').style.display = 'none';
        document.getElementById('searchTabContent').style.display = 'none';
        refreshFriendsModal();
    };
    document.getElementById('showRequestsTab').onclick = () => {
        document.getElementById('friendsTabContent').style.display = 'none';
        document.getElementById('requestsTabContent').style.display = 'block';
        document.getElementById('searchTabContent').style.display = 'none';
        refreshFriendsModal();
    };
    document.getElementById('showSearchTab').onclick = () => {
        document.getElementById('friendsTabContent').style.display = 'none';
        document.getElementById('requestsTabContent').style.display = 'none';
        document.getElementById('searchTabContent').style.display = 'block';
        document.getElementById('searchResultsContainer').innerHTML = '';
    };
    document.getElementById('doSearchBtn').onclick = async () => {
        const query = document.getElementById('searchUserInput').value;
        const results = await searchUsers(query);
        const container = document.getElementById('searchResultsContainer');
        if (!results.length) { container.innerHTML = '<div>Ничего не найдено</div>'; return; }
        container.innerHTML = '';
        results.forEach(u => {
            const div = document.createElement('div');
            div.style.padding = '8px';
            div.innerHTML = `${escapeHtml(u.username)} <button class="addFriendBtn" data-id="${u.id}">+ Добавить</button>`;
            container.appendChild(div);
        });
        document.querySelectorAll('.addFriendBtn').forEach(btn => {
            btn.onclick = () => sendFriendRequest(parseInt(btn.dataset.id));
        });
    };

    // Группы
    const groupModal = document.getElementById('groupModal');
    const createGroupBtn = document.getElementById('createGroupBtn');
    const closeGroupModalBtn = document.getElementById('closeGroupModalBtn');
    const confirmGroupBtn = document.getElementById('confirmGroupBtn');
    createGroupBtn.onclick = async () => {
        await loadFriends();
        if (!allFriends.length) { showToast('Нет друзей для группы', true); return; }
        const opts = allFriends.map(f => `<label><input type="checkbox" value="${f.id}" class="groupMemberCheckbox"> ${escapeHtml(f.username)}</label>`).join('');
        document.getElementById('friendsForGroupList').innerHTML = opts;
        groupModal.style.display = 'flex';
    };
    closeGroupModalBtn.onclick = () => groupModal.style.display = 'none';
    confirmGroupBtn.onclick = async () => {
        const name = document.getElementById('groupName').value.trim();
        if (!name) { showToast('Введите название', true); return; }
        const selected = Array.from(document.querySelectorAll('#friendsForGroupList input:checked')).map(cb => parseInt(cb.value));
        if (!selected.length) { showToast('Выберите друзей', true); return; }
        try {
            const newChat = await createGroupChat(name, selected);
            document.getElementById('groupName').value = '';
            groupModal.style.display = 'none';
            showToast(`Группа "${name}" создана`);
            await loadChats();
            selectChat(newChat.id);
        } catch(err) { showToast(`Ошибка: ${err.message}`, true); }
    };

    document.getElementById('logoutBtn').onclick = () => { localStorage.removeItem('chat_token'); location.reload(); };
    document.getElementById('sendBtn').onclick = sendMessage;
    document.getElementById('messageInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    document.getElementById('searchChatsInput').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        document.querySelectorAll('.chat-item').forEach(item => {
            const name = item.querySelector('.chat-name')?.innerText.toLowerCase() || '';
            item.style.display = name.includes(q) ? 'flex' : 'none';
        });
    });

    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, (m) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
</script>
</body>
</html>
